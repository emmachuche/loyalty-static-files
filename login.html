<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Loyalty Destination Club</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="./style/shared.css">
  <link rel="stylesheet" href="./style/login.css">
  <script src="./js/script.js" defer></script>
</head>

<body class="login-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- COMPONENT: LoginNavigation -->
  <nav class="login-navigation"><button class="button button--outline" type="button" data-action="home">Back to
      home</button><button type="button" class="login-languages" data-action="language">En | Es</button></nav>
  <main class="login-main" id="main">
    <!-- COMPONENT: LoginCard -->
    <section class="login-card" aria-labelledby="login-title"><img class="login-logo" src="assets/logo-vertical.png"
        alt="Loyalty Destination Club" width="154" height="134">
      <h1 id="login-title">Welcome Back</h1>
      <p>Sign in to your Certificate Holders Portal</p>
      <!-- COMPONENT: LoginFields -->
      <div class="login-fields">
        <div class="field"><label for="login-email">Email address</label><input id="login-email" type="email"
            placeholder="Email" autocomplete="email"></div>
        <div class="field"><label for="login-password">Password</label><input id="login-password" type="password"
            placeholder="**********" autocomplete="current-password"></div><button class="button " type="button"
          data-action="sign-in">Sign-in</button><button type="button" class="forgot-password"
          data-action="forgot-password">Forgot Password?</button>
      </div>
    </section>
  </main>
  <footer class="login-footer">Powered by Valcubity 2026 Valcubity. All rights reserved.</footer>


</body>

</html>
